live_config_reload = true
[env]
TERM = "xterm-256color"
# "cursor.style" = "Block"
# "debug.render_timer" = false
# theme = "Catppuccin"
# "window.opacity" = 5.0

[bell]
animation = "EaseOutExpo"
duration = 0
# Colors (Nord)

# Alacritty's default color scheme pre-0.13 (based on tomorrow_night)
# https://github.com/alacritty/alacritty/blob/v0.12.3/alacritty/src/config/color.rs
# Colors (One Dark)

# Default colors
[colors.primary]
background = '#24273A' # base
foreground = '#CAD3F5' # text
# Bright and dim foreground colors
dim_foreground = '#CAD3F5' # text
bright_foreground = '#CAD3F5' # text

# Cursor colors
[colors.cursor]
text = '#24273A' # base
cursor = '#F4DBD6' # rosewater

[colors.vi_mode_cursor]
text = '#24273A' # base
cursor = '#B7BDF8' # lavender

# Search colors
[colors.search.matches]
foreground = '#24273A' # base
background = '#A5ADCB' # subtext0

[colors.search.focused_match]
foreground = '#24273A' # base
background = '#A6DA95' # green

[colors.footer_bar]
foreground = '#24273A' # base
background = '#A5ADCB' # subtext0

# Keyboard regex hints
[colors.hints.start]
foreground = '#24273A' # base
background = '#EED49F' # yellow

[colors.hints.end]
foreground = '#24273A' # base
background = '#A5ADCB' # subtext0

# Selection colors
[colors.selection]
text = '#24273A' # base
background = '#F4DBD6' # rosewater

# Normal colors
[colors.normal]
black = '#494D64' # surface1
red = '#ED8796' # red
green = '#A6DA95' # green
yellow = '#EED49F' # yellow
blue = '#8AADF4' # blue
magenta = '#F5BDE6' # pink
cyan = '#8BD5CA' # teal
white = '#B8C0E0' # subtext1

# Bright colors
[colors.bright]
black = '#5B6078' # surface2
red = '#ED8796' # red
green = '#A6DA95' # green
yellow = '#EED49F' # yellow
blue = '#8AADF4' # blue
magenta = '#F5BDE6' # pink
cyan = '#8BD5CA' # teal
white = '#A5ADCB' # subtext0

# Dim colors
[colors.dim]
black = '#494D64' # surface1
red = '#ED8796' # red
green = '#A6DA95' # green
yellow = '#EED49F' # yellow
blue = '#8AADF4' # blue
magenta = '#F5BDE6' # pink
cyan = '#8BD5CA' # teal
white = '#B8C0E0' # subtext1


[font]
size = 14

[font.bold]
family = "JetBrainsMono Nerd font"
style = "Bold"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "JetBrainsMono Nerd Font"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 0

[mouse]
# faux_scrolling_lines = 1
hide_when_typing = true

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

# [mouse.double_click]
# threshold = 300

# [mouse.triple_click]
# threshold = 300

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[shell]
program = "/bin/zsh"

[window]
# decorations = full"
dynamic_title = true
# option_as_alt = "Both"
# startup_mode = "Maximized"
# opacity = 0.95
opacity = 1

[window.dimensions]
columns = 160
lines = 40

[window.padding]
x = 5
y = 5
